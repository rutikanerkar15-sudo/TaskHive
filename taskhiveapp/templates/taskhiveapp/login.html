{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - TaskHive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">



    <style>

        /* =========================
           RESET
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f4f6f9;

            color: #222;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .login-container {
            width: 100%;
            max-width: 430px;

            padding: 20px;
        }


        /* =========================
           LOGO
        ========================= */

        .logo {
            text-align: center;

            font-size: 32px;
            font-weight: bold;

            margin-bottom: 25px;

            color: #222;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {
            background: white;

            padding: 35px;

            border-radius: 14px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.10);
        }


        /* =========================
           HEADING
        ========================= */

        .login-card h1 {
            text-align: center;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }


        /* =========================
           ERROR MESSAGE
        ========================= */

        .error-message {
            background: #ffe8e8;

            color: #c62828;

            border: 1px solid #f5b5b5;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            font-size: 14px;

            font-weight: bold;

            margin-bottom: 7px;
        }


        /* =========================
           INPUT
        ========================= */

        .form-group input {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;

            transition: 0.2s;
        }


        .form-group input:focus {
            border-color: #222;

            box-shadow:
                0 0 0 2px rgba(0, 0, 0, 0.05);
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 7px;

            background: #222;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }


        .login-button:hover {
            background: #444;

            transform: translateY(-1px);
        }


        /* =========================
           REGISTER
        ========================= */

        .register-text {
            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #666;
        }


        .register-text a {
            color: #222;

            font-weight: bold;

            text-decoration: none;
        }


        .register-text a:hover {
            text-decoration: underline;
        }


        /* =========================
           BACK LINK
        ========================= */

        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #666;

            text-decoration: none;

            font-size: 14px;
        }


        .back-link:hover {
            color: #222;

            text-decoration: underline;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-card {
                padding: 25px;
            }

            .logo {
                font-size: 28px;
            }

            .login-card h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <div class="login-container">


        <!-- LOGO -->

        <div class="logo">

            🐝 TaskHive

        </div>


        <!-- LOGIN CARD -->

        <div class="login-card">


            <h1>
                Welcome Back
            </h1>


            <p class="subtitle">

                Login to your TaskHive workspace

            </p>


            <!-- ERROR -->

            {% if error %}

                <div class="error-message">

                    {{ error }}

                </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form method="POST">

                {% csrf_token %}


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>


                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >

                    Login

                </button>


            </form>


            <!-- REGISTER -->

            <div class="register-text">

                Don't have an account?

                <a href="{% url 'register' %}">
                    Register
                </a>

            </div>


        </div>


        <!-- BACK -->

        <a
            href="{% url 'dashboard' %}"
            class="back-link"
        >

            ← Back to Dashboard

        </a>


    </div>


</body>

</html>
