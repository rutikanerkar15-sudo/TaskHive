{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied - TaskHive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>



        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 450px;
            max-width: 90%;
            padding: 45px 35px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 30px;
            color: #333;
        }

        .icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fee2e2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
        }

        h1 {
            color: #222;
            margin-bottom: 12px;
        }

        .message {
            color: #777;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .dashboard-btn {
            display: inline-block;
            padding: 12px 25px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .dashboard-btn:hover {
            background: #3730a3;
        }

        .logout {
            display: block;
            margin-top: 18px;
            color: #dc2626;
            text-decoration: none;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="logo">
            🐝 TaskHive
        </div>

        <div class="icon">
            🔒
        </div>

        <h1>
            Access Denied
        </h1>

        <p class="message">
            You don't have permission to access this page.
            Please contact your manager or administrator
            if you believe this is an error.
        </p>

        <a href="{% url 'dashboard' %}" class="dashboard-btn">
            ← Back to Dashboard
        </a>

        <a href="{% url 'logout' %}" class="logout">
            Logout
        </a>

    </div>

</body>

</html>
```
